services:
  mongo:
    image: mongo:7
    # TODO: Nombres propios
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # En staging, exponemos en localhost solo para que el CI pueda probar
    # TODO: Porque este pueto en especifico
    ports: ["127.0.0.1:27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      #TODO: esto corresponde a una direccion de data en especifico localmente?
    volumes: ["mongo-staging-data:/data/db"]
  redis:
  # TODO: esto quien lo especifica? como se cuales versiones hay
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
volumes:
  mongo-staging-data: